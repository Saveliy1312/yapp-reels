<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Очередь публикаций Yapp</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1c1c1e; --muted: #6b6b70; --line: #e4e4e0;
    --ok: #1f8a4c; --ok-bg: #e5f4ea; --wait: #8a5a00; --wait-bg: #fdf1d8; --bad: #b3261e; --bad-bg: #fbe4e2;
    --accent: #3f51b5; --series: #f3e8ff; --series-text: #6b21a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --card: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31;
      --ok: #6fd39a; --ok-bg: #16301f; --wait: #f0c060; --wait-bg: #33280f; --bad: #ff8a80; --bad-bg: #3a1714;
      --accent: #9fa8ff; --series: #2d1b45; --series-text: #d8b4fe;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .next { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar label { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .day-head h2 { font-size: 16px; margin: 0; }
  .day-head .count { color: var(--muted); font-size: 14px; }
  .today .day-head h2::after { content: " · сегодня"; color: var(--accent); }
  .row { display: grid; grid-template-columns: 52px 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .cover { position: relative; width: 44px; height: 78px; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: var(--line); cursor: pointer; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 16px; background: rgba(0,0,0,.25); opacity: .85; transition: opacity .15s; }
  .cover:hover::after, .cover:focus-visible::after { opacity: 1; background: rgba(0,0,0,.4); }
  dialog { border: 0; padding: 0; border-radius: 16px; background: var(--card); color: var(--text); width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog video { display: block; width: 100%; max-height: 70vh; aspect-ratio: 9 / 16; background: #000; }
  .dlg-body { padding: 12px 14px 14px; }
  .dlg-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
  .dlg-head b { font-size: 15px; }
  .dlg-when { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .dlg-close { border: 0; background: var(--line); color: var(--text); border-radius: 99px; width: 30px; height: 30px; font-size: 16px; cursor: pointer; flex: none; }
  .dlg-caption { white-space: pre-wrap; font-size: 13px; margin: 0; }
  .dlg-missing { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--bg); }
  .title { font-weight: 500; }
  .series { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--series); color: var(--series-text); margin-right: 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 2px; }
  details p { white-space: pre-wrap; margin: 6px 0 0; font-size: 13px; }
  .badge { font-size: 13px; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .published { background: var(--ok-bg); color: var(--ok); }
  .waiting { background: var(--wait-bg); color: var(--wait); }
  .missed { background: var(--bad-bg); color: var(--bad); }
  a { color: var(--accent); }
  .err { color: var(--bad); }
  .filter { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px; margin-right: 8px; }
  .filter button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 4px 12px; border-radius: 99px; cursor: pointer; }
  .filter button[aria-pressed="true"] { background: var(--accent); color: var(--card); }
  .th-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 20px; }
  .kind { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--muted); margin-right: 6px; }
  details ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 40px 36px 1fr; gap: 10px; }
    .row .cover { width: 36px; height: 64px; }
    .row .badge-cell { grid-column: 3; }
    .row .th-icon { width: 36px; height: 36px; }
  }
</style>
</head>
<body>
<main>
  <h1>Очередь публикаций Yapp</h1>
  <p class="sub">@we_yapp · время московское · рилсы в Instagram и посты в Threads, которые выкладывает автопубликация (то, что запланировано вручную в Meta Business Suite, здесь не видно)</p>
  <div class="stats" id="stats"></div>
  <div class="next" id="next"></div>
  <div class="toolbar">
    <div class="filter" id="filter" role="group" aria-label="Что показывать">
      <button data-kind="all">Все</button><button data-kind="reel">Рилсы</button><button data-kind="thread">Threads</button>
    </div>
    <label><input type="checkbox" id="showPast"> показать прошедшие дни</label>
  </div>
  <div id="days"><p class="sub">Загружаю очередь…</p></div>
</main>
<dialog id="player">
  <div id="dlg-media"></div>
  <div class="dlg-body">
    <div class="dlg-head"><b id="dlg-title"></b><button class="dlg-close" id="dlg-close" aria-label="Закрыть">✕</button></div>
    <div class="dlg-when" id="dlg-when"></div>
    <p class="dlg-caption" id="dlg-caption"></p>
  </div>
</dialog>
<script>
const RAW = 'https://raw.githubusercontent.com/Saveliy1312/yapp-reels/main/';
const TZ = 'Europe/Moscow';
const dayKey = (d) => new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }).format(d);
const fmtTime = (d) => new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(d);
const fmtDay = (d) => new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'long' }).format(d);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cleanTitle = (t) => t.replace(/^\d+ · /, '');
const WORDS = { all: ['публикация', 'публикации', 'публикаций'], reel: ['рилс', 'рилса', 'рилсов'], thread: ['пост', 'поста', 'постов'] };
const plural = (n, w = WORDS[kind]) => n % 10 === 1 && n % 100 !== 11 ? w[0] : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? w[1] : w[2];

let showPast = false;
let kind = 'all';
try { showPast = localStorage.getItem('showPast') === '1'; } catch {}
try { kind = localStorage.getItem('kind') || 'all'; } catch {}
const filterBox = document.getElementById('filter');
const markFilter = () => filterBox.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kind)));
markFilter();
filterBox.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  kind = b.dataset.kind;
  try { localStorage.setItem('kind', kind); } catch {}
  markFilter();
  if (data) render();
});
const box = document.getElementById('showPast');
box.checked = showPast;

async function load() {
  const bust = '?t=' + Date.now();
  const json = (f) => fetch(RAW + f + bust).then((r) => r.json());
  const opt = (f, empty) => json(f).catch(() => empty);
  const [queue, state, threads, thState] = await Promise.all([
    json('queue.json'), json('state/published.json'), opt('threads.json', []), opt('state/threads.json', {}),
  ]);
  data = [
    ...queue.map((q) => ({ ...q, kind: 'reel', s: state[q.id] })),
    ...threads.map((t) => ({ ...t, kind: 'thread', s: thState[t.id], title: t.title || t.text.split('\n')[0] })),
  ].map((i) => ({ ...i, date: new Date(i.at) })).sort((a, b) => a.date - b.date);
  render();
}
let data = null;

function status(item) {
  const s = item.s;
  if (s?.status === 'published') return `<span class="badge published">${s.permalink ? `<a href="${esc(s.permalink)}" target="_blank" rel="noopener">вышел ↗</a>` : 'вышел'}</span>`;
  if (s?.status === 'missed') return '<span class="badge missed">пропущен</span>';
  return '<span class="badge waiting">запланирован</span>';
}

let current = [];
const dlg = document.getElementById('player');
const media = document.getElementById('dlg-media');

function openPlayer(id) {
  const i = current.find((x) => x.id === id);
  if (!i) return;
  const s = i.s;
  const enc = encodeURIComponent(i.media);
  document.getElementById('dlg-title').textContent = cleanTitle(i.title);
  document.getElementById('dlg-when').innerHTML = `${esc(fmtDay(i.date))}, ${fmtTime(i.date)} · ${status(i)}`;
  document.getElementById('dlg-caption').textContent = i.caption;
  media.innerHTML = `<video controls playsinline autoplay preload="metadata" poster="media/${enc}.png" src="media/${enc}.mp4"></video>`;
  media.querySelector('video').addEventListener('error', () => {
    media.innerHTML = `<div class="dlg-missing">Видео уже убрано с сайта после выхода.${s?.permalink ? `<br><a href="${esc(s.permalink)}" target="_blank" rel="noopener">Смотреть в Instagram ↗</a>` : ''}</div>`;
  });
  dlg.showModal();
}
function closePlayer() { dlg.close(); }
dlg.addEventListener('close', () => { media.innerHTML = ''; });
dlg.addEventListener('click', (e) => { if (e.target === dlg) closePlayer(); });
document.getElementById('dlg-close').addEventListener('click', closePlayer);
document.getElementById('days').addEventListener('click', (e) => {
  const b = e.target.closest('.cover');
  if (b) openPlayer(b.dataset.id);
});

function render() {
  const now = new Date();
  const items = data.filter((i) => kind === 'all' || i.kind === kind);
  current = items;
  const pub = items.filter((i) => i.s?.status === 'published').length;
  const missed = items.filter((i) => i.s?.status === 'missed').length;
  const wait = items.length - pub - missed;
  const lastDay = items.length ? fmtDay(items.at(-1).date) : '-';
  document.getElementById('stats').innerHTML = [
    [wait, 'ждут выхода'], [pub, 'вышло'], [missed, 'пропущено'], [lastDay, 'последний день очереди'],
  ].map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${l}</span></div>`).join('');

  const next = items.find((i) => !i.s);
  document.getElementById('next').innerHTML = next
    ? `Следующий${kind === 'all' ? ` (${next.kind === 'reel' ? 'рилс' : 'Threads'})` : ''}: <b>${esc(fmtDay(next.date))}, ${fmtTime(next.date)}</b> - ${esc(cleanTitle(next.title))}`
    : 'Очередь пуста - пора добавить новую партию.';

  const today = dayKey(now);
  const groups = new Map();
  for (const i of items) {
    const k = dayKey(i.date);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  }
  const html = [...groups].filter(([k]) => showPast || k >= today).map(([k, list]) => `
    <section class="day${k === today ? ' today' : ''}">
      <div class="day-head"><h2>${esc(fmtDay(list[0].date))}</h2><span class="count">${list.length} ${plural(list.length)}</span></div>
      ${list.map((i) => {
        if (i.kind === 'thread') return threadRow(i);
        const isSeries = /^Серия/.test(i.title);
        return `<div class="row">
          <span class="time">${fmtTime(i.date)}</span>
          <button class="cover" data-id="${esc(i.id)}" aria-label="Смотреть: ${esc(cleanTitle(i.title))}"><img loading="lazy" src="media/thumbs/${encodeURIComponent(i.media)}.jpg" alt="" onerror="this.onerror=null;this.src='media/${encodeURIComponent(i.media)}.png'"></button>
          <div>
            <div class="title">${kind === 'all' ? '<span class="kind">рилс</span>' : ''}${isSeries ? `<span class="series">${i.media.includes('max') ? 'Макс' : 'Аня'}</span>` : ''}${esc(cleanTitle(i.title))}</div>
            <details><summary>подпись</summary><p>${esc(i.caption)}</p></details>
          </div>
          <span class="badge-cell">${status(i)}</span>
        </div>`;
      }).join('')}
    </section>`).join('');
  document.getElementById('days').innerHTML = html || '<p class="sub">Впереди ничего не запланировано.</p>';
}

// Пост Threads: значок вместо обложки, под спойлером - текст, опрос и продолжения треда.
function threadRow(i) {
  const extra = [
    i.poll && `<p>Опрос:</p><ul>${i.poll.map((o) => `<li>${esc(o)}</li>`).join('')}</ul>`,
    i.replies && `<p>Продолжение треда:</p><ul>${i.replies.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`,
  ].filter(Boolean).join('');
  const label = i.poll ? 'опрос' : i.replies ? `тред из ${i.replies.length + 1}` : 'пост';
  return `<div class="row">
    <span class="time">${fmtTime(i.date)}</span>
    <span class="th-icon" aria-hidden="true">@</span>
    <div>
      <div class="title"><span class="kind">Threads · ${label}</span>${esc(i.title)}</div>
      <details><summary>текст</summary><p>${esc(i.text)}</p>${extra}</details>
    </div>
    <span class="badge-cell">${status(i)}</span>
  </div>`;
}

box.addEventListener('change', () => {
  showPast = box.checked;
  try { localStorage.setItem('showPast', showPast ? '1' : '0'); } catch {}
  load();
});
load().catch((e) => { document.getElementById('days').innerHTML = `<p class="err">Не удалось загрузить очередь: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
