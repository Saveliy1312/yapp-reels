name: Публикация в Threads

on:
  schedule:
    - cron: '5,35 * * * *'   # будильник; дальше запуск дежурит сам (scripts/watch.sh) и передаёт дежурство следующему
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish - выложить то, что пора; check - проверить токен, тексты и картинки'
        default: check
        type: choice
        options: [check, publish]

permissions:
  contents: write
  actions: write   # передать дежурство следующему запуску

concurrency:
  group: threads-${{ inputs.mode || 'publish' }}   # check не ждёт, пока дежурит publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежий main, а не коммит на момент запуска: иначе отметки предыдущего запуска не видны
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить
        if: inputs.mode && inputs.mode != 'publish'
        run: node scripts/threads.mjs ${{ inputs.mode }}
        env:
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/media
      - name: Дежурить и выкладывать по графику
        if: ${{ !inputs.mode || inputs.mode == 'publish' }}
        run: scripts/watch.sh threads.mjs state/threads.json "Вышли посты в Threads"
        env:
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/media
      - name: Передать дежурство следующему запуску
        if: ${{ !cancelled() && (!inputs.mode || inputs.mode == 'publish') }}
        run: |
          node -e 'process.exit(require("./threads.json").some((q) => new Date(q.at) > Date.now()) ? 0 : 1)' \
            && gh workflow run threads.yml -f mode=publish || echo "Очередь пуста - дальше разбудит cron"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Сохранить отметки о вышедших
        if: always()
        run: |
          git config user.name "yapp-reels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/threads.json
          git diff --cached --quiet && exit 0
          git commit -m "Вышли посты в Threads: $(date -u +%F' '%H:%M) UTC"
          git pull --rebase && git push
