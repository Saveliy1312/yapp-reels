name: Статистика Threads

# Раз в день сохраняет метрики последних 50 постов we_yapp в Threads в state/threads-insights.json и .md.
# Нужно право threads_manage_insights у секрета TH_TOKEN.
on:
  schedule:
    - cron: '55 2 * * *'   # 05:55 МСК, после статистики Instagram и не в минуты публикации (:05 и :35)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать статистику
        run: node scripts/threads.mjs insights
        env:
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
      - name: Сохранить
        run: |
          git config user.name "yapp-reels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/threads-insights.json state/threads-insights.md
          git diff --cached --quiet && exit 0
          git commit -m "Статистика Threads: $(date -u +%F)"
          git pull --rebase && git push
